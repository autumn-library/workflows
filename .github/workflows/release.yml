name: Подготовка релиза и публикация в хабе

on:
  workflow_call:
    inputs:
      oscript_version:
        required: false
        type: string
        default: "default"
      opm_version:
        description: Version of OPM to install (e.g., "1.1.0"). If empty, installs the latest version without version specification
        required: false
        default: ""
        type: string
      package_mask:
        required: false
        type: string
        default: "*.ospx"
      dotnet_version:
        description: Version of .NET to install
        type: string
        required: false
        default: ""
      os_version:
        description: Operating system to run release on
        type: string
        required: false
        default: "ubuntu-latest"
      trusted_publishing:
        description: "Publish with the workflow's OIDC id-token instead of PUSH_TOKEN. The caller must grant 'id-token: write'"
        type: boolean
        required: false
        default: false
      hub_url:
        description: Hub address for trusted publishing
        type: string
        required: false
        default: "https://hub.oscript.io"
      pool:
        description: Hub pool for trusted publishing. Empty means the hub's default pool
        type: string
        required: false
        default: ""
      audience:
        description: Audience of the id-token for trusted publishing. Empty means hub_url
        type: string
        required: false
        default: ""
    secrets:
      PUSH_TOKEN:
        required: false

env:
  PACKAGE_MASK: ${{ inputs.package_mask }}

jobs:
  build:
    runs-on: ${{ inputs.os_version }}
    steps:
      # Загрузка проекта
      - name: Актуализация
        uses: actions/checkout@v7.0.1

      - name: Установка .NET
        if: inputs.dotnet_version != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Вычисление версии OneScript
        shell: bash
        id: extract_oscript_version
        run: |
          set -ex
          if [ "${{ inputs.oscript_version }}" = "default" ]
          then
            extracted_version=$(grep ".ВерсияСреды(" packagedef | sed 's|[^"]*"||' | sed -r 's/".+//' || true)
            version="${extracted_version:-stable}"
          else
            version="${{ inputs.oscript_version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      
      - name: Установка OneScript
        uses: otymko/setup-onescript@v1.5.1
        with:
          version: ${{ steps.extract_oscript_version.outputs.version }}

      # Установка зависимостей пакета
      - name: Установка зависимостей (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ inputs.opm_version }}" -ne "") {
            opm install opm@${{ inputs.opm_version }}
          } else {
            opm install opm
          }
          opm install -l

      - name: Установка зависимостей (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "${{ inputs.opm_version }}" ]; then
            opm install opm@${{ inputs.opm_version }}
          else
            opm install opm
          fi
          opm install -l

      - name: Сборка пакета
        run: opm build .

      - name: Заливка артефактов
        uses: actions/upload-artifact@v7
        with:
          name: package.zip
          path: ./${{ env.PACKAGE_MASK }}

      #- name: Заливка в релиз
      #  uses: AButler/upload-release-assets@v2.0.2
      #  with:
      #    files: ./${{ env.PACKAGE_MASK }}
      #    repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация в hub.oscript.io
        if: ${{ !inputs.trusted_publishing }}
        shell: bash
        env:
          GITHUB_OAUTH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          OPM_HUB_CHANNEL: stable
        run: opm push ${{ env.PACKAGE_MASK }}

      # Токена хаба нет: хаб проверяет подпись id-token и сверяет репозиторий, конвейер
      # и реф с доверием, заведённым на пакет. Входы идут через env — пул приходит
      # из workflow_dispatch, и подстановка в текст скрипта была бы инъекцией.
      - name: Доверенная публикация в хаб
        id: trusted_push
        if: ${{ inputs.trusted_publishing }}
        shell: bash
        env:
          HUB_URL: ${{ inputs.hub_url }}
          HUB_POOL: ${{ inputs.pool }}
          HUB_AUDIENCE: ${{ inputs.audience }}
          OPM_HUB_CHANNEL: stable
        run: |
          hub="${HUB_URL%/}"
          audience="${HUB_AUDIENCE:-$hub}"
          pool=$(printf '%s' "$HUB_POOL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$pool" ]; then
            push_url="$hub/push"
          elif [[ "$pool" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            push_url="$hub/api/v1/pools/$pool/push"
          else
            echo "::error::Недопустимое имя пула '$pool': латинские буквы, цифры, '-', '_', '.', первый символ — буква или цифра"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub не выдал id-token: добавьте в вызывающий workflow 'permissions: id-token: write'"
            exit 1
          fi

          files=()
          while IFS= read -r found; do files+=("$found"); done < <(compgen -G "$PACKAGE_MASK" || true)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::По маске '$PACKAGE_MASK' найдено файлов: ${#files[@]}, а нужен ровно один"
            exit 1
          fi
          file="${files[0]}"

          id_token=$(curl -sSf -G "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$audience" | jq -r '.value // empty')
          if [ -z "$id_token" ]; then
            echo "::error::GitHub не вернул id-token"
            exit 1
          fi
          echo "::add-mask::$id_token"

          echo "Публикация $file в $push_url"
          curl -sS --fail-with-body -X POST "$push_url" \
            -H "OAUTH-TOKEN: $id_token" \
            -H "FILE-NAME: $(basename "$file")" \
            -H "CHANNEL: $OPM_HUB_CHANNEL" \
            --data-binary "@$file"
 
